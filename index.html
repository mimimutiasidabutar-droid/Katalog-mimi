<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MimiFood - Katalog Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #f8f9fa; }
        .menu-card:hover { transform: translateY(-5px); transition: 0.3s; }
        .cart-badge { position: absolute; top: -8px; right: -8px; background: red; color: white; border-radius: 50%; padding: 2px 6px; font-size: 12px; }
    </style>
</head>
<body class="pb-24">

    <!-- Header -->
    <header class="bg-orange-500 text-white p-6 shadow-lg text-center">
        <h1 class="text-3xl font-bold italic">MimiFood</h1>
        <p class="text-sm opacity-90">By_Yumimy - Bekasi, Indonesia</p>
    </header>

    <!-- Search & Category -->
    <div class="p-4 max-w-md mx-auto">
        <div class="relative">
            <input type="text" id="searchInput" placeholder="Cari menu favoritmu..." class="w-full p-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-orange-500 shadow-sm">
            <i class="fa fa-search absolute right-4 top-4 text-gray-400"></i>
        </div>
    </div>

    <!-- Menu List -->
    <div class="p-4 grid grid-cols-1 md:grid-cols-2 gap-6" id="menu-container">
        <!-- Menu items will be injected here by JS -->
    </div>

    <!-- Floating Cart Button -->
    <div class="fixed bottom-6 right-6 z-50">
        <button onclick="toggleCart()" class="bg-orange-600 text-white p-4 rounded-full shadow-2xl relative">
            <i class="fa fa-shopping-cart text-2xl"></i>
            <span id="cart-count" class="cart-badge">0</span>
        </button>
    </div>

    <!-- Cart Modal -->
    <div id="cartModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-[60] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-md p-6 max-h-[80vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h2 class="text-xl font-bold">Keranjang Pesanan</h2>
                <button onclick="toggleCart()" class="text-gray-500 text-2xl">&times;</button>
            </div>
            <div id="cart-items" class="space-y-4 mb-6"></div>
            <div class="border-t pt-4">
                <div class="flex justify-between font-bold text-lg mb-4">
                    <span>Total:</span>
                    <span id="cart-total">Rp 0</span>
                </div>
                <div class="space-y-3">
                    <input type="text" id="userName" placeholder="Nama Lengkap Kamu" class="w-full p-2 border rounded-lg">
                    <input type="text" id="userAddress" placeholder="Alamat Pengiriman (Bekasi)" class="w-full p-2 border rounded-lg">
                    <textarea id="userNote" placeholder="Catatan (Contoh: Gak pake jengkol, Pedas banget, dll)" class="w-full p-2 border rounded-lg"></textarea>
                    <button onclick="sendToWhatsApp()" class="w-full bg-green-500 text-white font-bold py-3 rounded-xl hover:bg-green-600">
                        <i class="fab fa-whatsapp mr-2"></i> Kirim Pesanan ke WhatsApp
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const menuData = [
            { id: 1, name: "Pangsit Rebus Chili Oil", price: 10000, img: "pangsitrebus.png", desc: "Pangsit lembut dengan chili oil khas MimiFood." },
            { id: 2, name: "Pangsit Goreng Chili Oil", price: 10000, img: "pangsitgoreng.png", desc: "Sensasi renyah pangsit goreng dengan bumbu pedas." },
            { id: 3, name: "Nasi Goreng Jengkol Spesial", price: 12000, img: "nasgorjengkol.png", desc: "Nasgor aroma jengkol yang bikin nagih." },
            { id: 4, name: "Ayam Sambal Matah + Nasi", price: 18000, img: "ayamsambalmatah.png", desc: "Ayam goreng empuk dengan sambal matah segar." },
            { id: 5, name: "Ayam Sambal Terasi + Nasi", price: 18000, img: "ayamsambalterasi.png", desc: "Perpaduan ayam goreng dan sambal terasi nikmat." },
            { id: 6, name: "Torinote-ba", price: 15000, img: "torinoteba.png", desc: "Sayap ayam isi daging olahan spesial." },
            { id: 7, name: "Nasi Bakar Cumi", price: 12000, img: "nasicumi.png", desc: "Nasi bakar wangi dengan isian cumi gurih." },
            { id: 8, name: "Nasi Bakar Ayam Suwir", price: 12000, img: "nasiayamsuwir.png", desc: "Nasi bakar gurih dengan ayam suwir melimpah." },
            { id: 9, name: "Bakcang Ketan Original", price: 13000, img: "bakcangori.png", desc: "Bakcang ketan padat dengan isian daging bumbu." },
            { id: 10, name: "Pecel Sayur Spesial", price: 10000, img: "pecel.png", desc: "Aneka sayuran segar dengan bumbu kacang kental." }
        ];

        let cart = [];

        function renderMenu(items) {
            const container = document.getElementById('menu-container');
            container.innerHTML = items.map(item => `
                <div class="bg-white rounded-2xl shadow-md overflow-hidden menu-card flex flex-col">
                    <img src="${item.img}" alt="${item.name}" class="w-full h-48 object-cover">
                    <div class="p-4 flex flex-col flex-grow">
                        <h3 class="text-lg font-bold">${item.name}</h3>
                        <p class="text-gray-500 text-sm mb-2 flex-grow">${item.desc}</p>
                        <div class="flex justify-between items-center mt-auto">
                            <span class="text-orange-600 font-bold text-lg">Rp ${item.price.toLocaleString()}</span>
                            <button onclick="addToCart(${item.id})" class="bg-orange-500 text-white px-4 py-2 rounded-lg font-semibold hover:bg-orange-600 text-sm">
                                <i class="fa fa-plus mr-1"></i> Tambah
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const item = menuData.find(i => i.id === id);
            const inCart = cart.find(i => i.id === id);
            if(inCart) { inCart.qty++; } else { cart.push({...item, qty: 1}); }
            updateCart();
        }

        function updateCart() {
            document.getElementById('cart-count').innerText = cart.reduce((acc, curr) => acc + curr.qty, 0);
            const cartItems = document.getElementById('cart-items');
            cartItems.innerHTML = cart.map(item => `
                <div class="flex justify-between items-center border-b pb-2">
                    <div>
                        <p class="font-semibold">${item.name}</p>
                        <p class="text-sm text-gray-500">Rp ${item.price.toLocaleString()} x ${item.qty}</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <button onclick="changeQty(${item.id}, -1)" class="bg-gray-200 px-2 rounded">-</button>
                        <span>${item.qty}</span>
                        <button onclick="changeQty(${item.id}, 1)" class="bg-gray-200 px-2 rounded">+</button>
                    </div>
                </div>
            `).join('');
            
            const total = cart.reduce((acc, curr) => acc + (curr.price * curr.qty), 0);
            document.getElementById('cart-total').innerText = `Rp ${total.toLocaleString()}`;
        }

        function changeQty(id, delta) {
            const item = cart.find(i => i.id === id);
            item.qty += delta;
            if(item.qty <= 0) { cart = cart.filter(i => i.id !== id); }
            updateCart();
        }

        function toggleCart() {
            document.getElementById('cartModal').classList.toggle('hidden');
        }

        function sendToWhatsApp() {
            const name = document.getElementById('userName').value;
            const addr = document.getElementById('userAddress').value;
            const note = document.getElementById('userNote').value;
            
            if(!name || !addr) return alert('Mohon isi Nama dan Alamat pengiriman ya!');

            let text = `*PESANAN MIMIFOOD*%0A-----------------------%0A`;
            text += `*Nama:* ${name}%0A`;
            text += `*Alamat:* ${addr}%0A`;
            if(note) text += `*Catatan:* ${note}%0A`;
            text += `-----------------------%0A`;
            
            cart.forEach(item => {
                text += `• ${item.name} (${item.qty}x)%0A`;
            });
            
            const total = cart.reduce((acc, curr) => acc + (curr.price * curr.qty), 0);
            text += `-----------------------%0A*Total: Rp ${total.toLocaleString()}*`;
            
            window.open(`https://wa.me/6285161042702?text=${text}`, '_blank');
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const filtered = menuData.filter(m => m.name.toLowerCase().includes(e.target.value.toLowerCase()));
            renderMenu(filtered);
        });

        renderMenu(menuData);
    </script>
</body>
</html>
